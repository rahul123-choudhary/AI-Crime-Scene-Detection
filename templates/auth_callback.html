<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authenticating with Google | CSI Forensic AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forensic.css') }}">
    <style>
        body {
            background: #080a0f;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: rgba(14, 21, 37, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 32px 40px;
            text-align: center;
            max-width: 420px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="spinner"></div>
        <h3 style="margin: 0 0 8px; font-weight: 700;">Verifying Google Credentials...</h3>
        <p style="margin: 0; color: #94a3b8; font-size: 14px;">Authorizing access to Forensic Command Center</p>
    </div>

    <script>
        // Supabase returns tokens in the URL hash fragment (#access_token=...&refresh_token=...)
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');

        if (accessToken) {
            // Post token to backend to set session
            fetch('/auth/session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_token: accessToken })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    window.location.href = '/?auth=error';
                }
            })
            .catch(() => {
                window.location.href = '/dashboard';
            });
        } else {
            // If direct redirect or query param
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 800);
        }
    </script>
</body>
</html>
